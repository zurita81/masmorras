name: Publicar versão web

# Toda vez que o código novo chega na branch main, o jogo é compilado para
# navegador (pygbag / WebAssembly) e publicado no GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pygbag
        run: pip install pygbag

      - name: Montar a pasta do jogo (só o que o navegador precisa)
        run: |
          mkdir -p web/masmorras
          cp main.py web/masmorras/
          cp -r src assets web/masmorras/
          find web -name __pycache__ -prune -exec rm -rf {} +

      - name: Compilar para a web
        run: python -m pygbag --build web/masmorras

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/masmorras/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
